# Router preset for llama-server --models-preset (b9860). Phase 0 skeleton; the full 17+6 fleet lands in Phase 2.
# Rules (source-verified on the pin, common/preset.cpp):
#   - Every key must sit under a [section] header; a top-level key becomes a phantom model named "default".
#   - [*] is the global section, merged into every child. Keys are CLI flag names with leading dashes stripped.
#   - launch.sh sets LLAMA_CACHE to an empty dir so this file is the entire served fleet (no HF-cache auto-serve).

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1

# Qwen self-contained MTP (embedded tensors, no separate drafter file).
# No mmproj here yet: Phase 0 smoke 10 probes the documented MTP x --mmproj conflict before Phase 2 decides.
[qwen3.5-9b-mtp-coding-ud-q4-k-xl]
model = /home/wma/.cache/huggingface/hub/models--unsloth--Qwen3.5-9B-MTP-GGUF/snapshots/9716a636ee4bddc3fed678220b7a33dd2a4160ae/Qwen3.5-9B-UD-Q4_K_XL.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
ctx-size = 131072
n-predict = 65536
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0

