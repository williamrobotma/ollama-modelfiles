# Router preset for llama-server --models-preset: the full fleet, 18 configs + 1 alias name.
# Rules (source-verified on the pin, common/preset.cpp):
#   - Every key must sit under a [section] header; a top-level key becomes a phantom model named "default".
#   - [*] is the global section, merged into every child. Keys are CLI flag names with leading dashes stripped.
#   - launch.sh sets LLAMA_CACHE to an empty dir so this file is the entire served fleet (no HF-cache auto-serve).
#   - top-p, min-p, repeat-penalty are guards: GGUF metadata can override them when unset (llama-arch.cpp KV list).
#   - presence-penalty and jinja restate plain build defaults (no metadata key exists); kept for explicitness.
#   - parallel = 1 is NOT a default: the server auto-resolves to 4 slots + unified KV (server.cpp), so this pins
#     one slot owning the whole cell pool. Unified KV keeps n_ctx_seq = n_ctx either way (llama-context.cpp).
# MTP x vision split: MTP entries carry no mmproj - policy and rationale in docs/parameters.md (Serving flags).
#   - -ngl stays unset: the build default (auto) fits partial-offload entries to VRAM.
# Ids name the lane (family-size-profile), never the quant (2026-08-09): the quant lives in the model = path only.
#   - Changing quant is a path edit - no rename, no client churn, so aliases are needed for defaults, not for quants.

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
min-p = 0.0
n-predict = 65536
repeat-penalty = 1.0
top-p = 0.95
presence-penalty = 0.0

