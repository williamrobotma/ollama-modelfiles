# Router preset (llama-server --models-preset): 23 configs + 1 alias name.
# Entry anatomy and layering: docs/architecture.md section 2.
#
# Format rules, source-verified on the pin (common/preset.cpp):
#   - Every key sits under a [section]; a top-level key becomes model "default".
#   - Keys = CLI flag names minus leading dashes; [*] merges into every child.
#   - Values are literal - no env or ~ expansion - so model paths are absolute.
#
# Repetition is by design: [*] is the format's only sharing mechanism, and
# each entry carries its complete profile so it reads whole, offline.
#
# Value rules:
#   - top-p, min-p, repeat-penalty: GGUF metadata overrides them when unset.
#   - presence-penalty, jinja: build defaults restated for explicitness.
#   - parallel = 1 (-np): unset auto-resolves to 4 slots; one slot gets all KV.
#   - -ngl unset: the build default fits partial-offload entries to VRAM.
#   - No mmproj on MTP entries - vision rides the non-MTP sibling
#     (the MTP x vision split: docs/parameters.md).
#   - flash-attn on and q8_0 KV stay paired; q8_0 V-cache hard-fails
#     without FA (docs/parameters.md).
#   - Qwen MTP is self-contained (embedded MTP tensors); only Gemma MTP
#     needs a separate drafter via model-draft.
#   - ctx-size: coding 200000; reasoning, instruct, non-MTP Gemma full 262144;
#     Gemma MTP entries keep their tested or drafter-trained ceilings.
#     Bonsai is the exception: all three entries sit at a measured residency
#     ceiling instead, because oversizing costs ~25x decode (see the block).
#
# Ids name the entry, never the quant (2026-08-09); grammar: README.md.
#
# Sampling profile per id suffix; the values are defined in docs/parameters.md:
#   gemma4-*      "Gemma 4 (Thinking)"
#   *-coding      "Qwen 3.6 (Precise Coding)"
#   *-reasoning   "Qwen 3.6 (General Tasks, thinking)"
#   no suffix     "Qwen 3.6 (Instruct Mode, non-thinking)"
# qwen3.5 ids use the Qwen 3.6 profiles too; no 3.5-specific profile exists.
# bonsai ids do the same: the vendor publishes only a thinking-mode triple,
# and the arm comparison that decides their profile is specs/bonsai-27b Phase 2.
# Thinking: Gemma thinks by default under --jinja; the no-suffix entries
# switch it off with reasoning = off.

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
min-p = 0.0
n-predict = 65536
repeat-penalty = 1.0
top-p = 0.95
presence-penalty = 0.0

# --- bonsai ---

# Ternary Bonsai-27B (PrismML): an extreme-quant rebuild of Qwen3.6-27B.
# Guarded GGUF: served under the froggeric template (templates/README.md).
#
# ctx-size 100096 is the measured residency ceiling, not a convention value
# (user, 2026-08-16; measurement in specs/bonsai-27b). It is written padded:
# llama.cpp rounds ctx up to a 256 boundary at load, so 100000 would serve
# 100096 anyway, and the literal value is what the ladder measured.
# Sizing to a real memory plan is the documented practice - the KV cache is
# allocated in full at load (llama-kv-cache.cpp:286), and --fit stops
# auto-sizing once ctx-size is set (fit.cpp:369). Oversizing is not free:
# at 262144 decode falls from ~54 tok/s to ~1.9 through the router.
# On WSL2 that failure is silent - the WDDM driver backs the overflow with
# host memory instead of refusing the allocation, as it would on Linux.
#
# Headroom: with mmproj resident this leaves ~650 MiB of the card free, so
# the entry partial-offloads when the Windows desktop is busy (measured at
# ~1.9 GB awake, ~5.5 GB busy). Accepted; spill costs speed, not correctness.
# Sampling is the Qwen 3.6 profile set pending the Phase 2 arm comparison.
[bonsai-27b-ternary-coding]
