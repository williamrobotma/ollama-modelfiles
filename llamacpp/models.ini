# Router preset for llama-server --models-preset (b9860): the full fleet, 17 configs + 6 aliases (Phase 2).
# Rules (source-verified on the pin, common/preset.cpp):
#   - Every key must sit under a [section] header; a top-level key becomes a phantom model named "default".
#   - [*] is the global section, merged into every child. Keys are CLI flag names with leading dashes stripped.
#   - launch.sh sets LLAMA_CACHE to an empty dir so this file is the entire served fleet (no HF-cache auto-serve).
# MTP x vision split: MTP entries carry no mmproj - policy and rationale in docs/parameters.md (Serving flags).
#   - -ngl stays unset: the b9860 default (auto) fits partial-offload entries to VRAM.

[*]
jinja = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
min-p = 0.0
n-predict = 65536
repeat-penalty = 1.0
top-p = 0.95
presence-penalty = 0.0

