# Repo-local rumdl config. It replaces (not merges) the global one, so the
# MD013 choices - 120 cols, check-only, never --fix - are restated here.
# Excluded: docs/history/*.md (immutable session logs) and CLAUDE.md
# (a single @AGENTS.md import line, not a document).
[global]
exclude = ["docs/history/*.md", "CLAUDE.md"]

[MD013]
line-length = 120
code-blocks = false
tables = false
reflow = false
