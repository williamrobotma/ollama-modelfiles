# Repo rumdl config; it replaces (not merges) the global one, so MD013 is
# respecified here. Run it check-only: --fix is an invocation choice, not a
# key. Excluded: history logs and research records (kept as written), and
# CLAUDE.md (a single @AGENTS.md import line).
[global]
exclude = [
    "docs/history/*.md",
    "specs/*/research.md",
    "specs/done/*/research.md",
    "CLAUDE.md",
]

[MD013]
line-length = 120
code-blocks = false
tables = false
reflow = false
