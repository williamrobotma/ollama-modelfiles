# Repo-local rumdl config; replaces (not merges) the global one, so the
# MD013 settings (120 cols, check-only, never --fix) are repeated here.
# docs/history/*.md are immutable session logs; excluded entirely.
# CLAUDE.md is a single @AGENTS.md import line, not a document.
[global]
exclude = ["docs/history/*.md", "CLAUDE.md"]

[MD013]
line-length = 120
code-blocks = false
tables = false
reflow = false
